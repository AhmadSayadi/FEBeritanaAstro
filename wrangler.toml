# Cloudflare Workers configuration for the Astro SSR site.
#
# As of @astrojs/cloudflare v14 (Astro 7), the adapter targets Cloudflare
# WORKERS with static assets. The adapter emits its own resolved config at
# dist/server/wrangler.json during build, MERGING the values below into it.
#
# Build + deploy:
#   npm run build:cloudflare
#   npx wrangler deploy --config dist/server/wrangler.json
# Local runtime test:
#   npx wrangler dev --config dist/server/wrangler.json

name = "beritana"

# `nodejs_compat`                      — sanitize-html (article/pages) needs Node built-ins.
# `nodejs_compat_populate_process_env` — copies the Worker's env vars/secrets into
#                                        process.env at RUNTIME (auto for dates
#                                        >= 2025-04-01; listed explicitly to be sure).
# Without the populate flag, process.env is empty at runtime, backend calls go
# out without the API key, and the homepage/article data comes back empty.
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# CRITICAL: `wrangler deploy` DELETES all plain vars before re-applying them from
# this file. Dashboard-set vars therefore vanish on every deploy (the bug we hit).
# keep_vars = true stops that deletion, and the [vars] block below makes the
# public (non-secret) config live in the repo so it is applied on every deploy
# and never lost. SECRETS (API_SECRET_KEY, REVALIDATE_SECRET) are intentionally
# NOT here — set them once in the dashboard as encrypted "Secret" type; encrypted
# secrets are preserved across deploys.
keep_vars = true

[vars]
PUBLIC_SITE_URL = "https://beritana.com"
PUBLIC_SITE_NAME = "Beritana"
API_BASE_URL = "https://cms.beritana.com/api"
PUBLIC_API_BASE_URL = "https://cms.beritana.com/api"
PUBLIC_CDN_BASE_URL = "https://cdn.beritana.com"
# false: free-tier Image Resizing quota (5k unique transforms/mo) is exhausted —
# /cdn-cgi/image/ returns 9422/429 and images break. Serve the backend-optimized
# originals instead. Flip to "true" only after upgrading the Cloudflare plan.
PUBLIC_CDN_RESIZE = "false"
# Feature toggles — set to "true" to render again (no code change needed).
PUBLIC_ENABLE_ADS = "false"
PUBLIC_ENABLE_LIVE_EVENT = "false"
