# Cloudflare Pages / Workers configuration for the Astro SSR site.
#
# Why this file exists:
#   The SSR worker imports Node-only libraries (notably sanitize-html and its
#   htmlparser2 dependency chain, used to clean author HTML on the article and
#   page routes). Cloudflare Workers only expose Node's built-in APIs when the
#   `nodejs_compat` compatibility flag is on, so without this the article page
#   would throw at runtime even though the build succeeds.
#
# Build the worker with:  npm run build:cloudflare   (DEPLOY_TARGET=cloudflare)
# Local runtime test:     npx wrangler pages dev dist
#
# On Cloudflare Pages you can either rely on this file or set the same two
# values in the dashboard (Settings → Functions → Compatibility flags/date).

name = "beritana"
pages_build_output_dir = "dist"

# 2024-09-23 is the date from which Workers ship full Node.js compatibility
# (process, Buffer, node:* built-ins) behind nodejs_compat. Any date >= this is
# fine; keep it fixed so runtime behaviour is reproducible.
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
