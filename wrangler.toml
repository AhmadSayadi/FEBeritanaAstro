# Cloudflare Workers configuration for the Astro SSR site.
#
# As of @astrojs/cloudflare v14 (Astro 7), the adapter targets Cloudflare
# WORKERS with static assets (not the old Pages `_worker.js` model). The adapter
# ALSO emits its own resolved config at dist/server/wrangler.json during build,
# merging the values below. These two fields are the ones that matter for us:
#
#   nodejs_compat  — the SSR worker imports sanitize-html (cleans author HTML on
#                    the article/pages routes), which needs Node built-ins.
#                    Without it the article route throws at runtime.
#   compatibility_date — pin so runtime behaviour is reproducible. >= 2024-09-23
#                    is required for full Node compatibility.
#
# Build + deploy:
#   npm run build:cloudflare
#   npx wrangler deploy            # from dist/server (adapter config), or via CI
#
# Local runtime test:
#   npm run build:cloudflare
#   npx wrangler dev               # run against dist/server/wrangler.json
#
# On Cloudflare's dashboard (Workers Builds / Git integration) set the same two
# compatibility values if you don't deploy via this file.

name = "beritana"

# `nodejs_compat_populate_process_env` is what copies the Worker's dashboard
# environment variables/secrets (API_SECRET_KEY, API_BASE_URL, ...) into
# `process.env` at RUNTIME. Without it, process.env is empty at runtime and
# every backend call goes out without the API key, so the homepage/article data
# comes back empty (the "stuck skeleton" bug). It's auto-enabled for dates
# >= 2025-04-01, but we also list it explicitly so it's guaranteed regardless.
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
