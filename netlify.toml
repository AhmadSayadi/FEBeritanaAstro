# Netlify config for the Astro build.
# Netlify auto-installs @astrojs/netlify when it detects an Astro SSR project;
# alternatively deploy the Node build output. Cache headers below mirror the
# original site, adapted to Astro's /_astro/ static asset path.

[build]
  command = "npm run build"
  publish = "dist"

# Static assets — immutable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# SEO files
[[headers]]
  for = "/sitemap*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/news-sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=300"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# AI content declaration — explicit type + 24h TTL (was in next.config.mjs)
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"
    Content-Type = "text/plain; charset=utf-8"
